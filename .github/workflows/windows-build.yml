name: CasioEmuX Windows Build (C++17)

on:
  push:
    branches: [ stable, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make

      - name: Put MINGW64 on PATH
        shell: powershell
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # --- C++17 erzwingen (ohne Codeänderung) ---
      - name: Force C++17 in build.bat
        shell: powershell
        working-directory: emulator
        run: |
          $f = "build.bat"
          if (!(Test-Path $f)) { Write-Error "emulator\build.bat not found"; exit 1 }
          $c = Get-Content $f -Raw
          $c = $c -replace '-std\s*=\s*(gnu\+\+)?20','-std=gnu++17'
          $c = $c -replace '-std\s*=\s*(gnu\+\+)?2a','-std=gnu++17'
          Set-Content $f $c -Encoding ASCII
          echo "==== build.bat after patch ===="
          type $f

      - name: Verify toolchain
        shell: cmd
        run: |
          echo Current dir: %CD%
          where gcc
          gcc --version
          dir emulator

      - name: Build (run build.bat inside emulator/)
        shell: cmd
        working-directory: emulator
        run: build.bat

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CasioEmuX-build
          path: |
            emulator\**\*.exe
            emulator\**\*.dll
