name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022   # stabil; kann auch windows-latest sein
    steps:
      - uses: actions/checkout@v4

      - name: Install TDM-GCC (Chocolatey)
        shell: powershell
        run: |
          choco install -y tdm-gcc
          # Häufige Installationspfade ins PATH hängen (einer trifft zu):
          echo "C:\TDM-GCC-64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          echo "C:\tools\tdm-gcc-64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Verify toolchain
        shell: cmd
        run: |
          where gcc
          gcc --version

      - name: Build (run build.bat inside emulator/)
        shell: cmd
        working-directory: emulator
        run: build.bat

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CasioEmuX-build
          path: |
            emulator\**\*.exe
            emulator\**\*.dll
