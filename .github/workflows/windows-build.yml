jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MinGW-w64
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      - name: Check toolchain
        run: |
          where gcc
          gcc --version

      - name: List repo (debug)
        shell: cmd
        run: dir

      - name: Build (run build.bat inside emulator/)
        shell: cmd
        working-directory: emulator
        run: build.bat

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CasioEmuX-build
          path: |
            emulator\**\*.exe
            emulator\**\*.dll
