name: Build CasioEmuX (Windows)

on:
  push:
    branches: [ "**" ]
    tags:     [ "v*" ]
  pull_request:

jobs:
  windows-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MinGW-w64 (x64)
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64  # passt zu den 64-bit Libs im Repo

      - name: Build emulator via build.bat
        shell: cmd
        working-directory: emulator
        run: build.bat

      - name: Stage runtime files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Force .\emulator\casioemu.exe .\dist\casioemu.exe
          Copy-Item -Force .\emulator\dlls\*.dll .\dist\
          # optional: Modelle mit einpacken (kein ROM!)
          # Copy-Item -Recurse -Force .\models\fx991cw_emu .\dist\models\fx991cw_emu

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path .\dist\* -DestinationPath CasioEmuX-win64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CasioEmuX-win64
          path: |
            CasioEmuX-win64.zip
            dist/**

      # Optional: Automatisch GitHub Release anhängen, wenn ein Tag gepusht wird
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CasioEmuX-win64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
