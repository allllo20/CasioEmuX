name: CasioEmuX Windows Build

on:
  push:
    branches: [ stable, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make

      - name: Put MINGW64 on PATH
        shell: powershell
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # 🔧 Patch: constructor template-id -> normal constructor
      - name: Patch CPU.hpp (constructor)
        shell: powershell
        working-directory: emulator
        run: |
          $f = "src\Chipset\CPU.hpp"
          if (!(Test-Path $f)) { Write-Error "File not found: $f"; exit 1 }
          $raw = Get-Content $f -Raw
          $patched = $raw -replace 'Register\s*<\s*value_type\s*>\s*\(\s*\)', 'Register()'
          if ($raw -ne $patched) {
            Set-Content $f $patched -Encoding UTF8
            echo "Patched constructor in $f"
          } else {
            echo "No match found; showing context lines for 'Register<value_type>'"
            Select-String -Path $f -Pattern 'Register<\s*value_type' -Context 0,4 || $true
          }
          echo "Preview around 'Register(' after patch:"
          Select-String -Path $f -Pattern 'Register\(' -Context 0,2

      - name: Verify toolchain
        shell: cmd
        run: |
          where gcc
          gcc --version
          dir emulator

      - name: Build (run build.bat inside emulator/)
        shell: cmd
        working-directory: emulator
        run: build.bat

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CasioEmuX-build
          path: |
            emulator\**\*.exe
            emulator\**\*.dll
