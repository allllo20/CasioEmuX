name: Build CasioEmuX (Windows)

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 with MinGW-w64 (x64)
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-gcc
          # sorgt dafür, dass C:\msys64\mingw64\bin im PATH ist
          msystem: MINGW64

      - name: Build emulator via build.bat
        shell: cmd
        working-directory: emulator
        run: build.bat

      - name: Stage runtime files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Force .\emulator\casioemu.exe .\dist\casioemu.exe
          Copy-Item -Force .\emulator\dlls\*.dll .\dist\

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path .\dist\* -DestinationPath CasioEmuX-win64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CasioEmuX-win64
          path: |
            CasioEmuX-win64.zip
            dist/**
