name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022  # stabil; vermeidet die 2025-Migration
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 (MINGW64 = msvcrt)
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make

      - name: Put MINGW64 on PATH
        shell: powershell
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Verify toolchain
        shell: cmd
        run: |
          where gcc
          gcc --version

      - name: Build (run build.bat inside emulator/)
        shell: cmd
        working-directory: emulator
        run: build.bat

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CasioEmuX-build
          path: |
            emulator\**\*.exe
            emulator\**\*.dll
